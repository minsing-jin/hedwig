{% extends "base.html" %}
{% block title %}Chat — Hedwig{% endblock %}
{% block content %}

<div class="chat-shell" id="chat-shell" data-conversation-id="{{ conversation_id }}">
  <aside class="chat-sidebar">
    <button class="btn btn-primary new-chat" onclick="newChat()">＋ 새 대화</button>
    <div id="convo-list" class="convo-list"></div>
  </aside>

  <main class="chat-main">
    <div id="messages" class="messages">
      <div class="welcome">
        <h1>🦉 Hedwig</h1>
        <p class="muted">한 곳에서 모든 시그널 + 브리핑 + 알고리즘 편집.</p>
        <div class="chip-row">
          <button class="chip" onclick="quickAsk('오늘의 daily 브리핑 보여줘')">📰 daily 브리핑</button>
          <button class="chip" onclick="quickAsk('이번 주 weekly 브리핑 핵심만 요약해줘')">📊 weekly</button>
          <button class="chip" onclick="quickAsk('최근 agent framework 관련 시그널 5개')">🔍 시그널 검색</button>
          <button class="chip" onclick="quickAsk('agent framework 위주로 바꿔줘')">📝 알고리즘 편집</button>
          <button class="chip" onclick="quickAsk('이번 주 진화 timeline 요약')">🧬 진화 history</button>
        </div>
      </div>
    </div>
    <div class="composer">
      <textarea id="composer-input" placeholder="질문하거나, URL 붙여 요약 받거나, '… 늘려줘' 식으로 알고리즘 바꿔보세요. (Enter 전송, Shift+Enter 줄바꿈)"
                rows="2"></textarea>
      <button id="send-btn" class="btn btn-primary" onclick="send()">전송</button>
    </div>
  </main>
</div>

<script>
const shell = document.getElementById('chat-shell');
let conversationId = shell.dataset.conversationId || newConvoId();
const msgsEl = document.getElementById('messages');
const inputEl = document.getElementById('composer-input');
const sendBtn = document.getElementById('send-btn');

function newConvoId() { return 'chat-' + Math.random().toString(36).slice(2, 14); }
function newChat() {
  conversationId = newConvoId();
  shell.dataset.conversationId = conversationId;
  msgsEl.innerHTML = '<div class="welcome"><h1>🦉 Hedwig</h1><p class="muted">새 대화. 무엇을 도와드릴까요?</p></div>';
  loadConvos();
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

function quickAsk(text) {
  inputEl.value = text;
  send();
}

async function loadConvos() {
  try {
    const r = await fetch('/chat/conversations');
    const data = await r.json();
    const box = document.getElementById('convo-list');
    box.innerHTML = (data.conversations || []).map(c =>
      `<button class="convo-item ${c.id === conversationId ? 'active' : ''}"
               onclick="openConvo('${c.id}')">${escapeHtml(c.title || 'New chat')}</button>`
    ).join('');
  } catch (_) {}
}

async function openConvo(id) {
  conversationId = id;
  shell.dataset.conversationId = id;
  msgsEl.innerHTML = '<div class="muted" style="padding:20px;">로드 중…</div>';
  try {
    const r = await fetch(`/chat/conversations/${encodeURIComponent(id)}/messages`);
    const data = await r.json();
    msgsEl.innerHTML = '';
    (data.messages || []).forEach(m => renderMessage(m));
    scrollEnd();
    loadConvos();
  } catch (e) { msgsEl.innerHTML = `<div class="error">로드 실패: ${e}</div>`; }
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function md(s) {
  let t = escapeHtml(s);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  t = t.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank">$2</a>');
  t = t.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  t = t.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  t = t.replace(/^- (.*)$/gm, '<li>$1</li>');
  t = t.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  t = t.replace(/\n{2,}/g, '</p><p>');
  return '<p>' + t + '</p>';
}

function renderMessage(m) {
  const wrap = document.createElement('div');
  wrap.className = `msg msg-${m.role}`;
  if (m.role === 'tool') {
    wrap.classList.add('msg-tool');
    let preview = m.content;
    try {
      const parsed = JSON.parse(m.content);
      preview = JSON.stringify(parsed, null, 2).slice(0, 1200);
    } catch (_) {}
    wrap.innerHTML = `
      <details>
        <summary>🔧 ${escapeHtml(m.tool_name || 'tool')} 결과</summary>
        <pre>${escapeHtml(preview)}</pre>
      </details>`;
  } else if (m.role === 'assistant') {
    let html = m.content ? md(m.content) : '';
    if (m.tool_calls && Array.isArray(m.tool_calls)) {
      html += '<div class="tool-calls">' + m.tool_calls.map(tc =>
        `<span class="tc-chip">→ ${escapeHtml(tc.function?.name || '')}</span>`
      ).join('') + '</div>';
    }
    wrap.innerHTML = `<div class="bubble">${html}</div>`;
  } else if (m.role === 'user') {
    wrap.innerHTML = `<div class="bubble">${md(m.content)}</div>`;
  } else {
    wrap.innerHTML = `<div class="bubble muted">${md(m.content)}</div>`;
  }
  msgsEl.appendChild(wrap);
}

function scrollEnd() {
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  // Optimistic render
  if (msgsEl.querySelector('.welcome')) msgsEl.innerHTML = '';
  renderMessage({role: 'user', content: text});
  inputEl.value = '';
  scrollEnd();
  sendBtn.disabled = true;

  const typing = document.createElement('div');
  typing.className = 'msg msg-assistant typing';
  typing.innerHTML = '<div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
  msgsEl.appendChild(typing);
  scrollEnd();

  try {
    const r = await fetch('/chat/message', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({conversation_id: conversationId, message: text}),
    });
    const data = await r.json();
    typing.remove();
    if (data.conversation_id) {
      conversationId = data.conversation_id;
      shell.dataset.conversationId = conversationId;
    }
    // Reload full thread so tool messages render correctly
    await openConvo(conversationId);
  } catch (e) {
    typing.remove();
    renderMessage({role: 'assistant', content: `오류: ${e}`});
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

loadConvos();

// If arrived with ?q=… (from a brief / signal "Chat에서 더 깊이" link)
(function autoSendFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  if (q) {
    inputEl.value = q;
    history.replaceState(null, '', '/chat');
    setTimeout(send, 250);
  }
})();
</script>

<style>
.chat-shell { display: grid; grid-template-columns: 240px 1fr; height: calc(100vh - 120px);
              gap: 0; max-width: 1200px; margin: 0 auto; }
.chat-sidebar { border-right: 1px solid #e5e7eb; padding: 12px; overflow-y: auto;
                 background: #f9fafb; }
.new-chat { width: 100%; }
.convo-list { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.convo-item { text-align: left; padding: 8px 10px; border: none; background: transparent;
               cursor: pointer; border-radius: 6px; font-size: 13px; color: #1f2937;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo-item:hover { background: #e5e7eb; }
.convo-item.active { background: #dbeafe; color: #1e40af; font-weight: 600; }

.chat-main { display: flex; flex-direction: column; min-height: 0; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex;
             flex-direction: column; gap: 16px; }
.welcome { text-align: center; padding: 40px 20px; }
.welcome h1 { margin-bottom: 8px; }
.chip-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.chip { padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 16px;
         background: white; cursor: pointer; font-size: 13px; color: #1f2937; }
.chip:hover { background: #f3f4f6; }

.msg { max-width: 80%; }
.msg-user { align-self: flex-end; }
.msg-user .bubble { background: #2563eb; color: white; }
.msg-assistant { align-self: flex-start; max-width: 90%; }
.msg-assistant .bubble { background: #f3f4f6; color: #111827; }
.msg-tool { align-self: flex-start; max-width: 90%; }
.msg-tool details { background: #fffbeb; border-left: 3px solid #f59e0b;
                     padding: 8px 12px; border-radius: 4px; font-size: 12px;
                     color: #1f2937; }
.msg-tool summary { cursor: pointer; font-weight: 600; color: #1f2937; }
.msg-tool pre { background: #111827; color: #e5e7eb; padding: 10px; border-radius: 4px;
                 font-size: 11px; overflow-x: auto; max-height: 280px; white-space: pre-wrap; }

.bubble { padding: 12px 16px; border-radius: 14px; line-height: 1.55; font-size: 14px;
           color: #111827; }
.bubble p { margin: 0 0 8px 0; }
.bubble p:last-child { margin-bottom: 0; }
.bubble code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px;
                font-family: 'SF Mono', Menlo, monospace; font-size: 12px; }
.msg-user .bubble code { background: rgba(255,255,255,.18); color: white; }
.bubble a { color: #2563eb; text-decoration: underline; }
.msg-user .bubble a { color: #fef3c7; }
.tool-calls { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.tc-chip { font-size: 11px; padding: 1px 7px; background: #ffedd5; color: #9a3412;
            border-radius: 8px; }

.composer { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid #e5e7eb;
             background: white; }
.composer textarea { flex: 1; padding: 12px; font-size: 14px; border: 1px solid #d1d5db;
                      border-radius: 10px; resize: none; font-family: inherit;
                      color: #111827; background: white; }
.composer textarea:focus { outline: none; border-color: #2563eb; }
.composer .btn { align-self: flex-end; }

.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; background: #9ca3af; border-radius: 50%;
           animation: bounce 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: .4; }
  40% { transform: translateY(-4px); opacity: 1; }
}
.error { color: #b91c1c; padding: 20px; }

@media (max-width: 720px) {
  .chat-shell { grid-template-columns: 1fr; }
  .chat-sidebar { display: none; }
}
</style>

{% endblock %}
