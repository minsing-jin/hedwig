<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hedwig Dashboard{% endblock %}</title>
  <link rel="icon" href="/assets/hedwig-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/v3.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#7c5cff">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(() => {});
      });
    }
  </script>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">
      <span class="logo">🦉</span>
      <span class="name">Hedwig</span>
      <span class="version">v3.0</span>
    </div>
    <div class="nav-links">
      <a href="/chat" style="font-weight: 700;">💬 Chat</a>
      <a href="/demo">🎯 Demo</a>
      <a href="/">Home</a>
      <a href="/ambient/pwa">Ambient</a>
      <a href="/feed">📱 Feed</a>
      <a href="/brief">Brief</a>
      <a href="/profile">👤 Profile</a>
      <a href="/signals">Signals</a>
      <a href="/evolution">Evolution</a>
      <a href="/sandbox">Sandbox</a>
      <a href="/meta">Meta</a>
      <a href="/status">Status</a>
      <a href="/sovereignty">Sovereignty</a>
      <a href="/sources">Sources</a>
      <a href="/settings">Settings</a>
      <a href="/criteria">Criteria</a>
      <a href="/setup">Setup</a>
      <a href="/onboarding">Onboarding</a>
      <a href="/onboarding/auto">Auto Onboarding</a>
      <a href="/admin" style="color:#dc2626;">🔧 Reset</a>
    </div>
  </nav>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Algorithm sovereignty for individuals</span>
  </footer>
</body>
</html>
