<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hedwig Dashboard{% endblock %}</title>
  <link rel="icon" href="/assets/hedwig-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/v3.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#7c5cff">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(() => {});
      });
    }
  </script>
</head>
<body>
  <nav class="nav" data-dashboard-nav-grouped="true">
    <div class="nav-left-rail">
      <div class="nav-brand">
        <span class="logo">🦉</span>
        <span class="name">Hedwig</span>
        <span class="version">v3.0</span>
      </div>
      <div class="language-rail" aria-label="Language selector">
        <label for="hedwig-language" data-i18n="language.label">Language</label>
        <select id="hedwig-language" data-language-selector>
          <option value="ko" data-i18n="language.ko">한국어</option>
          <option value="zh" data-i18n="language.zh">中文</option>
          <option value="en" data-i18n="language.en">English</option>
        </select>
      </div>
    </div>
    <div
      class="nav-links"
      aria-label="Dashboard navigation"
      data-primary-navigation="/setup /feed /brief /chat"
    >
      <!-- Core high-frequency destinations for first-time dashboard use. -->
      <a href="/setup" class="nav-primary" data-i18n="nav.setup">Setup</a>
      <a href="/feed" class="nav-primary" data-i18n="nav.feed">Feed</a>
      <a href="/brief" class="nav-primary" data-i18n="nav.brief">Brief</a>
      <a href="/chat" class="nav-primary" data-i18n="nav.chat">Chat</a>

      <details class="nav-group">
        <summary data-i18n="nav.group.read">Read</summary>
        <menu class="nav-menu">
          <a href="/" data-i18n="nav.home">Home</a>
          <a href="/ambient/pwa" data-i18n="nav.ambient">Ambient</a>
          <a href="/signals" data-i18n="nav.signals">Signals</a>
          <a href="/profile" data-i18n="nav.profile">Profile</a>
          <a href="/status" data-i18n="nav.status">Status</a>
        </menu>
      </details>

      <details class="nav-group">
        <summary data-i18n="nav.group.steer">Steer</summary>
        <menu class="nav-menu">
          <a href="/criteria" data-i18n="nav.criteria">Criteria</a>
          <a href="/onboarding" data-i18n="nav.onboarding">Onboarding</a>
          <a href="/onboarding/auto" data-i18n="nav.auto_onboarding">Auto Onboarding</a>
          <a href="/sovereignty" data-i18n="nav.sovereignty">Sovereignty</a>
        </menu>
      </details>

      <details class="nav-group">
        <summary data-i18n="nav.group.system">System</summary>
        <menu class="nav-menu">
          <a href="/sources" data-i18n="nav.sources">Sources</a>
          <a href="/settings" data-i18n="nav.settings">Settings</a>
          <a href="/evolution" data-i18n="nav.evolution">Evolution</a>
          <a href="/sandbox" data-i18n="nav.sandbox">Sandbox</a>
          <a href="/meta" data-i18n="nav.meta">Meta</a>
          <a href="/demo" data-i18n="nav.demo">Demo</a>
          <a href="/admin" class="nav-danger" data-i18n="nav.reset">Reset</a>
        </menu>
      </details>
    </div>
  </nav>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span data-i18n="footer.tagline">Algorithm steering for individuals</span>
  </footer>

    function applyHedwigLanguage(nextLanguage) {
      const supported = ["ko", "zh", "en"];
      const language = supported.includes(nextLanguage) ? nextLanguage : "ko";
      const dictionary = HEDWIG_I18N[language] || HEDWIG_I18N.ko;
      document.documentElement.lang = language;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.dataset.i18n;
        if (dictionary[key]) node.textContent = dictionary[key];
      });
      localStorage.setItem("hedwig.language", language);
      const selector = document.querySelector("[data-language-selector]");
      if (selector) selector.value = language;
    }

    const languageFromQuery = new URLSearchParams(window.location.search).get("lang");
    const savedLanguage = localStorage.getItem("hedwig.language");
    applyHedwigLanguage(languageFromQuery || savedLanguage || "ko");
    document.querySelector("[data-language-selector]")?.addEventListener("change", (event) => {
      applyHedwigLanguage(event.target.value);
    });
  </script>
</body>
</html>
